<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" role="img" aria-labelledby="title description">
  <title id="title">Earthquake Monitoring System Data Flow Diagram</title>
  <desc id="description">Data flow diagram showing the ESP32 sensor, administrator, server processes, database, SMS provider, and alert recipients.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1e3a5f"/>
    </marker>
    <style>
      .title { font: 700 30px Georgia, serif; fill: #111827; letter-spacing: .7px; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .entity { fill: #ffffff; stroke: #1e3a5f; stroke-width: 2; }
      .process { fill: #f8fbff; stroke: #1e3a5f; stroke-width: 2; }
      .store { fill: #f8fbff; stroke: #1e3a5f; stroke-width: 2; }
      .process-num { font: 700 16px Arial, sans-serif; fill: #172554; }
      .label { font: 500 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .flow { fill: none; stroke: #1e3a5f; stroke-width: 2; marker-end: url(#arrow); }
      .flow-label { font: 500 12px Arial, sans-serif; fill: #334155; }
      .divider { stroke: #1e3a5f; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1500" height="960" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" class="title">DATA FLOW DIAGRAM CHART</text>
  <text x="750" y="78" text-anchor="middle" class="subtitle">Earthquake Monitoring and SMS Alert System</text>

  <rect x="110" y="130" width="210" height="70" class="entity" filter="url(#shadow)"/>
  <text x="215" y="172" text-anchor="middle" class="label">Administrator</text>

  <rect x="500" y="120" width="210" height="80" class="process" filter="url(#shadow)"/>
  <line x1="500" y1="153" x2="710" y2="153" class="divider"/>
  <text x="605" y="143" text-anchor="middle" class="process-num">1.0</text>
  <text x="605" y="181" text-anchor="middle" class="label">Login</text>

  <rect x="500" y="300" width="220" height="95" class="process" filter="url(#shadow)"/>
  <line x1="500" y1="335" x2="720" y2="335" class="divider"/>
  <text x="610" y="325" text-anchor="middle" class="process-num">1.1</text>
  <text x="610" y="364" text-anchor="middle" class="label">Monitor Seismic</text>
  <text x="610" y="384" text-anchor="middle" class="label">Data</text>

  <rect x="90" y="475" width="230" height="75" class="entity" filter="url(#shadow)"/>
  <text x="205" y="507" text-anchor="middle" class="label">ESP32 + MPU6050</text>
  <text x="205" y="529" text-anchor="middle" class="small">Earthquake Sensor Device</text>

  <rect x="490" y="505" width="240" height="95" class="process" filter="url(#shadow)"/>
  <line x1="490" y1="540" x2="730" y2="540" class="divider"/>
  <text x="610" y="530" text-anchor="middle" class="process-num">1.2</text>
  <text x="610" y="570" text-anchor="middle" class="label">Receive &amp; Process</text>
  <text x="610" y="590" text-anchor="middle" class="label">Seismic Data</text>

  <rect x="1030" y="300" width="260" height="125" class="store" filter="url(#shadow)"/>
  <line x1="1050" y1="300" x2="1050" y2="425" class="divider"/>
  <text x="1070" y="344" class="process-num">D1</text>
  <text x="1168" y="348" text-anchor="middle" class="label">System Database</text>
  <text x="1168" y="373" text-anchor="middle" class="small">seismic_logs · sms_logs</text>
  <text x="1168" y="395" text-anchor="middle" class="small">alert_recipients · admin_users</text>

  <rect x="1030" y="535" width="230" height="90" class="process" filter="url(#shadow)"/>
  <line x1="1030" y1="570" x2="1260" y2="570" class="divider"/>
  <text x="1145" y="560" text-anchor="middle" class="process-num">1.3</text>
  <text x="1145" y="600" text-anchor="middle" class="label">SMS Alert Service</text>

  <rect x="1030" y="750" width="230" height="72" class="entity" filter="url(#shadow)"/>
  <text x="1145" y="782" text-anchor="middle" class="label">Alert Recipients</text>
  <text x="1145" y="804" text-anchor="middle" class="small">Students · Faculty · Staff</text>

  <rect x="140" y="750" width="220" height="80" class="process" filter="url(#shadow)"/>
  <line x1="140" y1="785" x2="360" y2="785" class="divider"/>
  <text x="250" y="775" text-anchor="middle" class="process-num">1.4</text>
  <text x="250" y="815" text-anchor="middle" class="label">Local Buzzer &amp; LCD</text>

  <path d="M320 165 H485" class="flow"/>
  <text x="403" y="153" text-anchor="middle" class="flow-label">Admin credentials</text>

  <path d="M605 200 V285" class="flow"/>
  <text x="621" y="248" class="flow-label">Authenticated access</text>

  <path d="M205 475 V445 H610 V410" class="flow"/>
  <text x="365" y="434" text-anchor="middle" class="flow-label">Live acceleration data</text>

  <path d="M320 513 H475" class="flow"/>
  <text x="397" y="501" text-anchor="middle" class="flow-label">Sensor readings</text>

  <path d="M730 552 H860 V405 H1015" class="flow"/>
  <text x="875" y="393" text-anchor="middle" class="flow-label">Event log &amp; alert status</text>

  <path d="M1030 365 H875 V347 H735" class="flow"/>
  <text x="875" y="335" text-anchor="middle" class="flow-label">Recent seismic records</text>

  <path d="M730 565 H1015" class="flow"/>
  <text x="873" y="552" text-anchor="middle" class="flow-label">Level 3 alert data</text>

  <path d="M1145 535 V440" class="flow"/>
  <text x="1160" y="486" class="flow-label">Active recipient list</text>

  <path d="M1145 625 V735" class="flow"/>
  <text x="1162" y="683" class="flow-label">SMS earthquake alert</text>

  <path d="M490 580 H410 V790 H375" class="flow"/>
  <text x="424" y="735" class="flow-label">Local alarm command</text>

  <rect x="505" y="875" width="490" height="45" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="903" text-anchor="middle" class="small">Data flows use arrows; D1 is the persistent system data store.</text>
</svg>
