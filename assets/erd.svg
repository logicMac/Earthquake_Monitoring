<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ND-SCPM Earthquake Monitoring System - Entity Relationship Diagram</title>
  <desc id="desc">ERD showing admin_users, seismic_logs, alert_recipients, and sms_logs tables with their relationships.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="headerTeal" x1="0" x2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="headerPurple" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #1e293b; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #64748b; }
      .table-title { font: 700 16px Arial, sans-serif; fill: #fff; }
      .pk { font: 700 13px Arial, sans-serif; fill: #fbbf24; }
      .fk { font: 700 13px Arial, sans-serif; fill: #f97316; }
      .field { font: 400 13px Arial, sans-serif; fill: #334155; }
      .type { font: 400 12px Arial, sans-serif; fill: #94a3b8; }
      .rel { font: 700 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#crows); }
      .line-one { stroke: #64748b; stroke-width: 2; fill: none; marker-start: url(#one); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="25" y="20" width="1350" height="860" rx="16" fill="#fff" filter="url(#shadow)"/>

  <text x="700" y="65" text-anchor="middle" class="title">ND-SCPM Earthquake Monitoring System</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">Entity Relationship Diagram</text>
  <line x1="100" y1="110" x2="1300" y2="110" stroke="#e2e8f0" stroke-width="2"/>

  <!-- seismic_logs table (left) -->
  <rect x="100" y="200" width="260" height="250" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="100" y="200" width="260" height="38" rx="8" fill="url(#headerBlue)"/>
  <rect x="100" y="222" width="260" height="16" fill="url(#headerBlue)"/>
  <text x="230" y="225" text-anchor="middle" class="table-title">seismic_logs</text>
  <text x="112" y="260" class="pk">PK</text>
  <text x="145" y="260" class="field">id</text>
  <text x="335" y="260" text-anchor="end" class="type">INT</text>
  <text x="112" y="282" class="field">device_id</text>
  <text x="335" y="282" text-anchor="end" class="type">VARCHAR</text>
  <text x="112" y="304" class="field">intensity</text>
  <text x="335" y="304" text-anchor="end" class="type">FLOAT</text>
  <text x="112" y="326" class="field">magnitude</text>
  <text x="335" y="326" text-anchor="end" class="type">FLOAT</text>
  <text x="112" y="348" class="field">mmi_level</text>
  <text x="335" y="348" text-anchor="end" class="type">VARCHAR</text>
  <text x="112" y="370" class="field">mmi_name</text>
  <text x="335" y="370" text-anchor="end" class="type">VARCHAR</text>
  <text x="112" y="392" class="field">percent_g</text>
  <text x="335" y="392" text-anchor="end" class="type">FLOAT</text>
  <text x="112" y="414" class="field">timestamp</text>
  <text x="335" y="414" text-anchor="end" class="type">DATETIME</text>
  <text x="112" y="436" class="field">alert_sent</text>
  <text x="335" y="436" text-anchor="end" class="type">BOOLEAN</text>

  <!-- alert_recipients table (right) -->
  <rect x="1040" y="200" width="240" height="180" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1040" y="200" width="240" height="38" rx="8" fill="url(#headerTeal)"/>
  <rect x="1040" y="222" width="240" height="16" fill="url(#headerTeal)"/>
  <text x="1160" y="225" text-anchor="middle" class="table-title">alert_recipients</text>
  <text x="1052" y="260" class="pk">PK</text>
  <text x="1085" y="260" class="field">id</text>
  <text x="1255" y="260" text-anchor="end" class="type">INT</text>
  <text x="1052" y="282" class="field">name</text>
  <text x="1255" y="282" text-anchor="end" class="type">VARCHAR</text>
  <text x="1052" y="304" class="field">phone_number</text>
  <text x="1255" y="304" text-anchor="end" class="type">VARCHAR</text>
  <text x="1052" y="326" class="field">category</text>
  <text x="1255" y="326" text-anchor="end" class="type">ENUM</text>
  <text x="1052" y="348" class="field">is_active</text>
  <text x="1255" y="348" text-anchor="end" class="type">BOOLEAN</text>

  <!-- sms_logs table (center) -->
  <rect x="570" y="200" width="260" height="205" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="570" y="200" width="260" height="38" rx="8" fill="url(#headerBlue)"/>
  <rect x="570" y="222" width="260" height="16" fill="url(#headerBlue)"/>
  <text x="700" y="225" text-anchor="middle" class="table-title">sms_logs</text>
  <text x="582" y="260" class="pk">PK</text>
  <text x="615" y="260" class="field">id</text>
  <text x="805" y="260" text-anchor="end" class="type">INT</text>
  <text x="582" y="282" class="fk">FK</text>
  <text x="615" y="282" class="field">log_id</text>
  <text x="805" y="282" text-anchor="end" class="type">INT</text>
  <text x="582" y="304" class="fk">FK</text>
  <text x="615" y="304" class="field">recipient_id</text>
  <text x="805" y="304" text-anchor="end" class="type">INT</text>
  <text x="582" y="326" class="field">phone_number</text>
  <text x="805" y="326" text-anchor="end" class="type">VARCHAR</text>
  <text x="582" y="348" class="field">message</text>
  <text x="805" y="348" text-anchor="end" class="type">TEXT</text>
  <text x="582" y="370" class="field">status</text>
  <text x="805" y="370" text-anchor="end" class="type">ENUM</text>
  <text x="582" y="392" class="field">sent_at</text>
  <text x="805" y="392" text-anchor="end" class="type">DATETIME</text>

  <!-- admin_users table (bottom center) -->
  <rect x="570" y="500" width="260" height="200" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="570" y="500" width="260" height="38" rx="8" fill="url(#headerPurple)"/>
  <rect x="570" y="522" width="260" height="16" fill="url(#headerPurple)"/>
  <text x="700" y="525" text-anchor="middle" class="table-title">admin_users</text>
  <text x="582" y="560" class="pk">PK</text>
  <text x="615" y="560" class="field">id</text>
  <text x="805" y="560" text-anchor="end" class="type">INT</text>
  <text x="582" y="582" class="field">username</text>
  <text x="805" y="582" text-anchor="end" class="type">VARCHAR</text>
  <text x="582" y="604" class="field">password</text>
  <text x="805" y="604" text-anchor="end" class="type">VARCHAR</text>
  <text x="582" y="626" class="field">full_name</text>
  <text x="805" y="626" text-anchor="end" class="type">VARCHAR</text>
  <text x="582" y="648" class="field">email</text>
  <text x="805" y="648" text-anchor="end" class="type">VARCHAR</text>
  <text x="582" y="670" class="field">last_login</text>
  <text x="805" y="670" text-anchor="end" class="type">DATETIME</text>

  <!-- Relationship: seismic_logs (1) -> sms_logs (N) -->
  <line x1="360" y1="325" x2="545" y2="325" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="315" text-anchor="middle" class="rel" style="font-size:12px">1 to N</text>

  <!-- Relationship: alert_recipients (1) -> sms_logs (N) -->
  <line x1="1040" y1="290" x2="855" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="945" y="280" text-anchor="middle" class="rel" style="font-size:12px">1 to N</text>

  <!-- Note explaining admin_users has no FK relationships -->
  <text x="700" y="740" text-anchor="middle" class="field" style="font-size:11px; fill:#94a3b8">* admin_users is standalone (authentication only, no FK relationships to other tables)</text>

  <!-- Legend -->
  <rect x="100" y="760" width="220" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="210" y="782" text-anchor="middle" class="field" style="font-weight:700">Legend</text>
  <text x="112" y="802" class="pk">PK</text>
  <text x="145" y="802" class="field">Primary Key</text>
  <text x="112" y="822" class="fk">FK</text>
  <text x="145" y="822" class="field">Foreign Key</text>

  <!-- Notes -->
  <rect x="380" y="760" width="620" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="690" y="782" text-anchor="middle" class="field" style="font-weight:700">Relationships</text>
  <text x="395" y="802" class="field">• seismic_logs (1) → sms_logs (N): One seismic event can have multiple SMS logs</text>
  <text x="395" y="822" class="field">• alert_recipients (1) → sms_logs (N): One recipient can receive multiple SMS alerts</text>
</svg>
