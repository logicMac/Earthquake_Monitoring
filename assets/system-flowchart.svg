<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">ND-SCPM Earthquake Monitoring System Flowchart</title>
  <desc id="desc">Flowchart showing sensor monitoring, local alerts, server processing, database storage, SMS delivery, dashboard updates, and administrator actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f3ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#1677d2"/>
      <stop offset="1" stop-color="#2795e8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#0a9b93"/>
      <stop offset="1" stop-color="#18b9ae"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#25557f" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#6d87a1"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #123552; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #55718a; }
      .section { font: 700 15px Arial, sans-serif; letter-spacing: 2px; fill: #3973a3; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #fff; }
      .box-copy { font: 400 14px Arial, sans-serif; fill: #eaf6ff; }
      .light-title { font: 700 18px Arial, sans-serif; fill: #164665; }
      .light-copy { font: 400 14px Arial, sans-serif; fill: #52738b; }
      .decision { font: 700 16px Arial, sans-serif; fill: #fff; }
      .label { font: 700 13px Arial, sans-serif; fill: #52738b; }
      .small { font: 400 12px Arial, sans-serif; fill: #52738b; }
      .line { stroke: #6d87a1; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #79a4c5; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#background)"/>
  <rect x="35" y="28" width="1530" height="1045" rx="24" fill="#fff" filter="url(#shadow)"/>

  <text x="800" y="87" text-anchor="middle" class="title">ND-SCPM Earthquake Monitoring System</text>
  <text x="800" y="116" text-anchor="middle" class="subtitle">System Process Flowchart</text>
  <line x1="100" y1="144" x2="1500" y2="144" stroke="#d7e8f7" stroke-width="2"/>

  <text x="265" y="183" text-anchor="middle" class="section">HARDWARE DETECTION</text>
  <text x="792" y="183" text-anchor="middle" class="section">SERVER PROCESSING</text>
  <text x="1300" y="183" text-anchor="middle" class="section">NOTIFICATION &amp; MONITORING</text>

  <rect x="135" y="215" width="260" height="83" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="265" y="249" text-anchor="middle" class="box-title">START MONITORING</text>
  <text x="265" y="274" text-anchor="middle" class="box-copy">ESP32 initializes WiFi, LCD and buzzer</text>

  <path d="M265 298 V334" class="line"/>
  <rect x="135" y="348" width="260" height="92" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="265" y="383" text-anchor="middle" class="box-title">MPU6050 SENSOR READS</text>
  <text x="265" y="408" text-anchor="middle" class="box-copy">3-axis acceleration at 20 Hz</text>

  <path d="M265 440 V477" class="line"/>
  <rect x="135" y="491" width="260" height="92" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="265" y="526" text-anchor="middle" class="box-title">CALCULATE INTENSITY</text>
  <text x="265" y="551" text-anchor="middle" class="box-copy">Convert and smooth acceleration in Gal</text>

  <path d="M265 583 V620" class="line"/>
  <path d="M265 632 L365 697 L265 762 L165 697 Z" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="265" y="692" text-anchor="middle" class="decision">EVENT ABOVE</text>
  <text x="265" y="714" text-anchor="middle" class="decision">LOCAL THRESHOLD?</text>

  <path d="M165 697 H90 V537 H123" class="line"/>
  <text x="98" y="684" class="label">NO</text>
  <text x="74" y="584" class="small">Continue</text>
  <text x="74" y="601" class="small">monitoring</text>

  <path d="M365 697 H464" class="line"/>
  <text x="402" y="682" class="label">YES</text>

  <rect x="480" y="648" width="250" height="98" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="605" y="683" text-anchor="middle" class="box-title">LOCAL WARNING</text>
  <text x="605" y="708" text-anchor="middle" class="box-copy">Buzzer pattern and LCD status</text>

  <path d="M730 697 H776 V584" class="line"/>
  <rect x="650" y="476" width="252" height="108" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="776" y="510" text-anchor="middle" class="box-title">SEND HTTPS POST</text>
  <text x="776" y="535" text-anchor="middle" class="box-copy">Intensity + device ID every 2 seconds</text>
  <text x="776" y="558" text-anchor="middle" class="box-copy">during an active event</text>

  <path d="M902 530 H947" class="line"/>
  <rect x="964" y="476" width="258" height="108" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="1093" y="510" text-anchor="middle" class="box-title">RECEIVE DATA API</text>
  <text x="1093" y="535" text-anchor="middle" class="box-copy">Validate the request and intensity</text>
  <text x="1093" y="558" text-anchor="middle" class="box-copy">at receive_data.php</text>

  <path d="M1093 584 V620" class="line"/>
  <rect x="964" y="634" width="258" height="104" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="1093" y="668" text-anchor="middle" class="box-title">CLASSIFY EVENT</text>
  <text x="1093" y="693" text-anchor="middle" class="box-copy">Calculate %g, MMI level</text>
  <text x="1093" y="716" text-anchor="middle" class="box-copy">and estimated magnitude</text>

  <path d="M1093 738 V772" class="line"/>
  <path d="M1093 783 L1205 850 L1093 917 L981 850 Z" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="1093" y="845" text-anchor="middle" class="decision">LEVEL 3</text>
  <text x="1093" y="867" text-anchor="middle" class="decision">EMERGENCY?</text>

  <path d="M981 850 H880 V790 H776 V746" class="line"/>
  <text x="920" y="836" class="label">NO</text>
  <rect x="650" y="787" width="252" height="88" rx="16" fill="#eaf5ff" stroke="#8fc2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="776" y="821" text-anchor="middle" class="light-title">STORE SEISMIC LOG</text>
  <text x="776" y="847" text-anchor="middle" class="light-copy">Event remains available to dashboard</text>

  <path d="M1205 850 H1261" class="line"/>
  <text x="1221" y="836" class="label">YES</text>
  <rect x="1276" y="801" width="230" height="98" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="1391" y="835" text-anchor="middle" class="box-title">GET ACTIVE RECIPIENTS</text>
  <text x="1391" y="860" text-anchor="middle" class="box-copy">Read alert_recipients list</text>

  <path d="M1391 899 V934" class="line"/>
  <rect x="1276" y="947" width="230" height="91" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="1391" y="981" text-anchor="middle" class="box-title">UNISMS API</text>
  <text x="1391" y="1006" text-anchor="middle" class="box-copy">Send emergency alert by SMS</text>

  <path d="M776 875 V949" class="dash"/>
  <path d="M776 949 H1248" class="dash"/>
  <rect x="482" y="949" width="250" height="89" rx="16" fill="#eaf5ff" stroke="#8fc2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="607" y="983" text-anchor="middle" class="light-title">MYSQL DATABASE</text>
  <text x="607" y="1008" text-anchor="middle" class="light-copy">seismic_logs and sms_logs</text>

  <rect x="964" y="947" width="250" height="91" rx="16" fill="#eaf5ff" stroke="#8fc2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089" y="981" text-anchor="middle" class="light-title">LIVE DASHBOARD</text>
  <text x="1089" y="1006" text-anchor="middle" class="light-copy">Browser polls data every 2 seconds</text>

  <path d="M732 993 H947" class="dash"/>
  <path d="M1214 993 H1247" class="dash"/>
  <text x="1170" y="933" text-anchor="middle" class="small">SMS results logged</text>

  <rect x="135" y="831" width="260" height="128" rx="16" fill="#eff8ff" stroke="#8fc2e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="265" y="865" text-anchor="middle" class="light-title">ADMINISTRATOR</text>
  <text x="265" y="893" text-anchor="middle" class="light-copy">Logs in to view dashboard,</text>
  <text x="265" y="915" text-anchor="middle" class="light-copy">reports and QuakeBot; manages</text>
  <text x="265" y="937" text-anchor="middle" class="light-copy">active SMS recipients</text>
  <path d="M395 895 H455 V993 H465" class="dash"/>

  <text x="265" y="1007" text-anchor="middle" class="small">Hardware uses configured testing or production thresholds.</text>
</svg>
